name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
    env:
      UV_PYTHON_DOWNLOADS: never
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the pinned dependency manager
        run: python -m pip install uv==0.12.21
      - name: Install locked development and optional dependencies
        run: uv sync --locked --all-extras --python '${{ matrix.python }}'
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Full isolated regression suite including MCP
        run: uv run --no-sync python scripts/run_handoff_tests.py --require-mcp --output reports/local/tests.json
      - name: Reproducible two-agent handoff demo
        run: uv run --no-sync python scripts/demo_handoff.py --output reports/local/demo
      - name: Build source and wheel distributions
        run: uv run --no-sync python -m build
      - name: Validate distribution metadata
        run: uv run --no-sync python -m twine check --strict dist/*
      - name: Export locked constraints for the clean installation
        run: uv export --frozen --all-extras --no-emit-project --no-hashes --format requirements-txt --output-file reports/local/locked-requirements.txt
      - name: Verify minimal CLI and MCP installations outside the checkout
        run: uv run --no-sync python scripts/check_wheel.py dist/*.whl --constraints reports/local/locked-requirements.txt --output reports/local/wheel.json
      - name: Retain verification reports and distributions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            reports/local/
            dist/
          if-no-files-found: warn
          retention-days: 14
