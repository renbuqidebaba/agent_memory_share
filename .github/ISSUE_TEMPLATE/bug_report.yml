name: Bug report / 问题报告
description: Report a reproducible failure in a local handoff workflow.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please include the smallest example that reproduces the problem. 中文或英文均可。
        Remove secrets and private task data from payloads, database exports, paths and logs.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Package version / 项目版本
      description: Output of agent-handoff --version, or the source version you used.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 运行环境
      description: OS, Python version, install command, and MCP client/version when relevant.
    validations:
      required: true
  - type: dropdown
    id: entrypoint
    attributes:
      label: Entry point / 使用入口
      options:
        - CLI
        - MCP
        - Installation / 安装
        - Legacy memory API / 旧记忆接口
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include commands, sanitized payloads and workspace conditions such as changed files or an expired lease.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs / 实际行为与日志
      description: Include the exit code or MCP tool error and the full relevant error after removing private information.
    validations:
      required: true
